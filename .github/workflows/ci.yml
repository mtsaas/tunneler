name: ci

# Every push and pull request is tested. A merge to main publishes the image
# as :latest and :<commit>, and the charts as 0.0.0-main.<commit>. A tag
# vX.Y.Z publishes the image as :vX.Y.Z, the charts as X.Y.Z, and a GitHub
# release with client binaries.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5 # caches the module download and build caches, keyed on go.sum
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      # Unit tests only. The Postgres and kind end-to-end tests skip without
      # TUNNELER_TEST_DSN and TUNNELER_KIND; run those locally.
      - run: go test -vet=all ./...
      - run: helm lint charts/tunneler-coordinator --values hack/kind/coordinator-values.yaml && helm lint charts/tunneler-exit --set server=https://example.com,cluster=ci

  publish:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # setup-go's cache is keyed on go.sum, so the test job's entry would shadow this job's
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: publish-go-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: publish-go-${{ hashFiles('go.sum') }}-

      - name: Decide what this build is called
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            {
              echo "IMAGE_TAGS=ghcr.io/mtsaas/tunneler:${tag}"
              echo "CHART_VERSION=${tag#v}"
              echo "APP_VERSION=${tag}"
              echo "LDFLAGS=-s -w -X github.com/mtsaas/tunneler/internal/version.tag=${tag}"
            } >> "$GITHUB_ENV"
          else
            {
              echo "IMAGE_TAGS=ghcr.io/mtsaas/tunneler:latest,ghcr.io/mtsaas/tunneler:${GITHUB_SHA}"
              echo "CHART_VERSION=0.0.0-main.${GITHUB_SHA::7}"
              echo "APP_VERSION=${GITHUB_SHA}"
              echo "LDFLAGS=-s -w"
            } >> "$GITHUB_ENV"
          fi

      # Compile here, where the build cache makes an unchanged dependency
      # tree nearly free, rather than inside Docker where it starts cold.
      - name: Build the image's binaries
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags="$LDFLAGS" -o dist/linux/$arch/tunneler ./cmd/tunneler
          done
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: SOURCE=prebuilt
          push: true
          tags: ${{ env.IMAGE_TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish the charts
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          for chart in tunneler-coordinator tunneler-exit; do
            helm package "charts/$chart" --version "$CHART_VERSION" --app-version "$APP_VERSION" --destination dist/charts
            helm push "dist/charts/$chart-$CHART_VERSION.tgz" oci://ghcr.io/mtsaas/charts
          done

      - name: Release the client
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist/release
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os="${target%/*}" arch="${target#*/}" ext=""
            [[ "$os" == windows ]] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="$LDFLAGS" -o "dist/bin/tunneler$ext" ./cmd/tunneler
            tar -C dist/bin -czf "dist/release/tunneler_${GITHUB_REF_NAME}_${os}_${arch}.tar.gz" "tunneler$ext"
            rm "dist/bin/tunneler$ext"
          done
          (cd dist/release && sha256sum * > checksums.txt)
          gh release create "$GITHUB_REF_NAME" dist/release/* --generate-notes --verify-tag
