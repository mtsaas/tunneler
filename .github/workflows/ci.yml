name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      # Unit tests only. The Postgres and kind end-to-end tests skip without
      # TUNNELER_TEST_DSN and TUNNELER_KIND; run those locally.
      - run: go test -vet=all ./...

  image:
    # Merges to main rebuild ghcr.io/mtsaas/tunneler:latest, plus a tag per commit.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mtsaas/tunneler:latest
            ghcr.io/mtsaas/tunneler:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
