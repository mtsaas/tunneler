# An exit node for the cluster "prod" on AKS. Nothing is registered anywhere
# for a new cluster: the pod authenticates with a projected service account
# token that the coordinator verifies against the cluster's own OIDC issuer
# (enable it with: az aks update --enable-oidc-issuer). The coordinator
# trusts every AKS cluster in the tenant through its exit_issuers pattern and
# binds the name "prod" to this cluster's issuer on first contact.
#
# The only per-cluster values are TUNNELER_CLUSTER and the ConfigMap.
#
# For local development instead, run the coordinator with
# "insecure_exit_auth": true and the exit node needs no identity at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tunneler-exit
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tunneler-exit
data:
  exit.json: |
    {
      "services": [
        {
          "name": "orders-db",
          "kind": "postgres",
          "dsn": "postgres://tunneler:$ORDERS_DB_PASSWORD@orders-db.shop.svc.cluster.local:5432/orders?sslmode=require",
          "labels": {"team": "shop"},
          "roles": ["readonly", "readwrite"]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tunneler-exit
spec:
  replicas: 2 # the coordinator uses whichever is connected
  selector:
    matchLabels: {app: tunneler-exit}
  template:
    metadata:
      labels: {app: tunneler-exit}
    spec:
      serviceAccountName: tunneler-exit
      containers:
        - name: exit
          image: ghcr.io/mtsaas/tunneler:latest
          args: ["start", "exit"]
          env:
            - {name: TUNNELER_SERVER, value: "https://tunneler.example.com"}
            - {name: TUNNELER_CLUSTER, value: "prod"}
            # Credentials stay in whatever Secret already holds them, such
            # as the one a Postgres operator generates.
            - name: ORDERS_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: orders-db-admin, key: password}
          ports:
            - {name: health, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
          readinessProbe:
            httpGet: {path: /readyz, port: health}
          volumeMounts:
            - {name: config, mountPath: /etc/tunneler, readOnly: true}
            - {name: token, mountPath: /var/run/secrets/tunneler, readOnly: true}
      volumes:
        - name: config
          configMap: {name: tunneler-exit}
        - name: token
          projected:
            sources:
              - serviceAccountToken:
                  audience: tunneler # the coordinator's exit_audience
                  expirationSeconds: 3600
                  path: token
