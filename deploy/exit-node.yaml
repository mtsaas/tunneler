# The exit node for one AKS cluster. Apply deploy/crd.yaml first.
#
# Nothing is registered anywhere for a new cluster: the pod authenticates to
# the coordinator with a projected service account token, verified against
# the cluster's own OIDC issuer (az aks update --enable-oidc-issuer). The
# coordinator binds the name in TUNNELER_CLUSTER to this cluster's issuer on
# first contact. Services come from TunnelService resources in any namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: tunneler
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tunneler-exit
  namespace: tunneler
  # For Key Vault credentials, also bind an Azure workload identity:
  # annotations:
  #   azure.workload.identity/client-id: "<managed identity client id>"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tunneler-exit
rules:
  - apiGroups: [tunneler.marconet.com]
    resources: [tunnelservices]
    verbs: [get, list, watch]
  - apiGroups: [tunneler.marconet.com]
    resources: [tunnelservices/status]
    verbs: [patch]
  # Reading Secrets is deliberately not granted here. A namespace that
  # registers a TunnelService with a kubernetesSecret reference grants `get`
  # on that one Secret with a Role like the one at the end of this file.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tunneler-exit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tunneler-exit
subjects:
  - kind: ServiceAccount
    name: tunneler-exit
    namespace: tunneler
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tunneler-exit
  namespace: tunneler
spec:
  replicas: 2 # the coordinator uses whichever is connected
  selector:
    matchLabels: {app: tunneler-exit}
  template:
    metadata:
      labels: {app: tunneler-exit}
      # For Key Vault credentials: azure.workload.identity/use: "true"
    spec:
      serviceAccountName: tunneler-exit
      containers:
        - name: exit
          image: ghcr.io/mtsaas/tunneler:latest
          args: ["start", "exit", "--kubernetes"]
          env:
            - {name: TUNNELER_SERVER, value: "https://tunneler.example.com"}
            - {name: TUNNELER_CLUSTER, value: "prod"}
          ports:
            - {name: health, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
          readinessProbe:
            httpGet: {path: /readyz, port: health}
          volumeMounts:
            - {name: token, mountPath: /var/run/secrets/tunneler, readOnly: true}
      volumes:
        - name: token
          projected:
            sources:
              - serviceAccountToken:
                  audience: tunneler # the coordinator's exit_audience
                  expirationSeconds: 3600
                  path: token
---
# In each namespace that registers a service backed by a Kubernetes Secret:
# the exit node may read exactly that Secret and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tunneler-read-dsn
  namespace: preview-pr-123
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [preview-pr-123-agent-server-secrets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tunneler-read-dsn
  namespace: preview-pr-123
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tunneler-read-dsn
subjects:
  - kind: ServiceAccount
    name: tunneler-exit
    namespace: tunneler
