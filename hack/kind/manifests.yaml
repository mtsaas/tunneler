# What the kind end-to-end test needs besides the two Helm charts: a Postgres
# to register, the registration, and leave for the coordinator to read the
# cluster's OIDC discovery document. See e2e/kind_test.go.
apiVersion: v1
kind: Namespace
metadata:
  name: tunneler
---
# The kind API server issues service account tokens as
# https://kubernetes.default.svc.cluster.local and serves that issuer's
# discovery document itself. Let the coordinator fetch it without a token.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tunneler-issuer-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:service-account-issuer-discovery
subjects:
  - kind: Group
    name: system:unauthenticated
---
apiVersion: v1
kind: Secret
metadata:
  name: pg-admin
  namespace: tunneler
stringData:
  database_uri: postgres://postgres:pw@postgres.tunneler.svc.cluster.local:5432/postgres?sslmode=disable
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: tunneler
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:17
          env:
            - {name: POSTGRES_PASSWORD, value: pw}
          ports:
            - {containerPort: 5432}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: tunneler
spec:
  selector: {app: postgres}
  ports:
    - {port: 5432}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tunneler-read-dsn
  namespace: tunneler
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [pg-admin]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tunneler-read-dsn
  namespace: tunneler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tunneler-read-dsn
subjects:
  - kind: ServiceAccount
    name: tunneler-exit
    namespace: tunneler
---
apiVersion: tunneler.marconet.com/v1alpha1
kind: TunnelService
metadata:
  name: postgres
  namespace: tunneler
spec:
  kind: postgres
  credentials:
    dsnRef:
      kubernetesSecret: {name: pg-admin, key: database_uri}
  grantableRoles: [pg_read_all_data]
  labels: {environment: e2e}
---
# A person, for the kubectl test. What they may do is this cluster's
# business: the coordinator only says who they are and which groups they hold.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: e2e-user
  namespace: tunneler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tunneler-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: Group
    name: tunneler:view
---
# "view" does not include exec; grant it in one namespace, to test upgrades.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tunneler-exec
  namespace: tunneler
rules:
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tunneler-exec
  namespace: tunneler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tunneler-exec
subjects:
  - kind: Group
    name: tunneler:view
