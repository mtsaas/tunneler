# A coordinator inside the kind cluster that trusts the cluster's own issuer,
# both for exit nodes and, standing in for Entra, for users.
image: {repository: tunneler, tag: e2e, pullPolicy: Never}
config:
  exit_issuers: ["https://kubernetes.default.svc.cluster.local"]
  # The API server's certificate is signed by the cluster's private CA.
  exit_issuer_ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  # A test user is a service account token with this audience:
  #   kubectl -n tunneler create token e2e-user --audience tunneler-users
  oidc:
    issuer: https://kubernetes.default.svc.cluster.local
    client_id: tunneler-users
    ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    # A service account's subject is a system: user, which exit nodes rightly
    # refuse to impersonate. The issuer is a stable stand-in for a person's
    # name in this test cluster; the grant below still matches the subject,
    # so another service account from this issuer gets no access.
    username_claim: iss
    user_id_claim: sub
  grants:
    - user: system:serviceaccount:tunneler:e2e-user
      labels: {cluster: kind, kind: kubernetes}
      roles: ["tunneler:view"]
