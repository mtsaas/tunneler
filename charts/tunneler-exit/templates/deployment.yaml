apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
        {{- if .Values.workloadIdentity.clientId }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      serviceAccountName: tunneler-exit
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Release.Name }}
      containers:
        - name: exit
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["start", "exit", "--kubernetes"]
          env:
            - name: TUNNELER_SERVER
              value: {{ required "server is required: the coordinator's URL" .Values.server | quote }}
            - name: TUNNELER_CLUSTER
              value: {{ required "cluster is required: the name this cluster goes by" .Values.cluster | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: health
              containerPort: 8081
          startupProbe:
            httpGet: {path: /healthz, port: health}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: token, mountPath: /var/run/secrets/tunneler, readOnly: true}
      volumes:
        # The token that proves to the coordinator which cluster this is.
        # Kubernetes issues and rotates it; the audience is the coordinator's
        # exit_audience.
        - name: token
          projected:
            sources:
              - serviceAccountToken:
                  audience: tunneler
                  expirationSeconds: 3600
                  path: token
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
