apiVersion: v1
kind: ServiceAccount
metadata:
  # The coordinator's exit_subject names this account; keep them in step.
  name: tunneler-exit
  {{- with .Values.workloadIdentity.clientId }}
  annotations:
    azure.workload.identity/client-id: {{ . | quote }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}
rules:
  - apiGroups: ["tunneler.marconet.com"]
    resources: ["tunnelservices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["tunneler.marconet.com"]
    resources: ["tunnelservices/status"]
    verbs: ["patch"]
  {{- if .Values.kubernetes.enabled }}
  {{- $groups := .Values.kubernetes.groups }}
  {{- $users := .Values.kubernetes.users }}
  {{- /* RBAC reads an empty resourceNames as every name, system:masters
         included, and `required` lets an empty list through. [""], which
         is what --set kubernetes.groups={} gives, is no group either. */}}
  {{- if or (not (kindIs "slice" $groups)) (empty $groups) (has "" $groups) }}
  {{- fail "kubernetes.groups must list at least one group when kubernetes.enabled (an empty list would let the exit node impersonate every group)" }}
  {{- end }}
  {{- if or (not (kindIs "slice" $users)) (empty $users) (has "" $users) }}
  {{- fail "kubernetes.users must list at least one user when kubernetes.enabled (an empty list would let the exit node impersonate every user)" }}
  {{- end }}
  {{- range $users }}
  {{- if hasPrefix "system:" . }}
  {{- fail "kubernetes.users must not include system: users" }}
  {{- end }}
  {{- end }}
  # Bound the service account's credential even if it is used outside the
  # exit process, where the request checks below do not run.
  - apiGroups: [""]
    resources: ["users"]
    verbs: ["impersonate"]
    resourceNames: {{ $users | toJson }}
  - apiGroups: [""]
    resources: ["groups"]
    verbs: ["impersonate"]
    resourceNames: {{ $groups | toJson }}
  {{- end }}
  {{- if eq .Values.secretAccess "cluster" }}
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  {{- else if ne .Values.secretAccess "namespaced" }}
  {{- fail "secretAccess must be \"namespaced\" or \"cluster\"" }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: tunneler-exit
    namespace: {{ .Release.Namespace }}
