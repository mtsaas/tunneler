apiVersion: v1
kind: ServiceAccount
metadata:
  # The coordinator's exit_subject names this account; keep them in step.
  name: tunneler-exit
  {{- with .Values.workloadIdentity.clientId }}
  annotations:
    azure.workload.identity/client-id: {{ . | quote }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}
rules:
  - apiGroups: ["tunneler.marconet.com"]
    resources: ["tunnelservices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["tunneler.marconet.com"]
    resources: ["tunnelservices/status"]
    verbs: ["patch"]
  {{- if eq .Values.secretAccess "cluster" }}
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  {{- else if ne .Values.secretAccess "namespaced" }}
  {{- fail "secretAccess must be \"namespaced\" or \"cluster\"" }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: tunneler-exit
    namespace: {{ .Release.Namespace }}
