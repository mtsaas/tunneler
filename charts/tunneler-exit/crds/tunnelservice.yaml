# TunnelService registers a service with the cluster's tunneler exit node.
# Create one per database in the namespace that owns it; the exit node
# discovers it, checks its credentials, and advertises it to the coordinator
# as <namespace>/<name>, or as <name> in the exit node's own namespace.
# Deleting it withdraws the service.
#
# This file is the single definition of the resource. Helm installs it with
# the chart; without Helm, apply it with kubectl.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tunnelservices.tunneler.marconet.com
spec:
  group: tunneler.marconet.com
  scope: Namespaced
  names:
    plural: tunnelservices
    singular: tunnelservice
    kind: TunnelService
    shortNames: [ts]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Kind
          type: string
          jsonPath: .spec.kind
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [kind]
              x-kubernetes-validations:
                - rule: "!(self.kind in ['postgres', 'redis']) || has(self.credentials)"
                  message: postgres and redis services need credentials
                - rule: "self.kind != 'kubernetes' || !has(self.credentials)"
                  message: a kubernetes service takes no credentials; the exit node uses its own service account
                - rule: "self.kind != 'redis' || has(self.redis)"
                  message: a redis service needs ACL profiles and topology configuration
              properties:
                kind:
                  description: >-
                    postgres: a database, reached with "tunneler connect".
                    redis: Redis standalone, Sentinel, or Cluster, reached with
                    "tunneler connect".
                    kubernetes: this cluster's API, reached with kubectl after
                    "tunneler kube config".
                  type: string
                  enum: [postgres, redis, kubernetes]
                redis:
                  type: object
                  required: [aclProfiles]
                  properties:
                    mode:
                      type: string
                      enum: [standalone, sentinel, cluster]
                      default: standalone
                    masterName: {type: string}
                    sentinels:
                      type: array
                      items: {type: string}
                    allowedNodes:
                      description: >-
                        CIDRs or exact hostnames that Sentinel or Cluster may
                        advertise as Redis data nodes.
                      type: array
                      items: {type: string}
                    aclProfiles:
                      description: >-
                        Redis ACL command, key, and channel rules for each
                        grantable role. The exit node creates one selector per
                        profile on a temporary Redis user.
                      type: object
                      additionalProperties:
                        type: array
                        items: {type: string}
                credentials:
                  type: object
                  required: [dsnRef]
                  properties:
                    dsnRef:
                      description: >-
                        Where the administrative connection string is kept. It
                        must be a postgres:// URL for postgres or a redis://
                        or rediss:// URL for Redis, with an administrative
                        user and password. The exit node adds nothing
                        from its own environment or files. Exactly one of
                        kubernetesSecret and azureKeyVault.
                      type: object
                      oneOf:
                        - required: [kubernetesSecret]
                        - required: [azureKeyVault]
                      properties:
                        kubernetesSecret:
                          description: >-
                            A key of a Secret in this namespace that the exit
                            node is allowed to read. Any TunnelService in this
                            namespace can use any key of such a Secret, so it
                            should hold the connection string alone.
                          type: object
                          required: [name, key]
                          properties:
                            name: {type: string}
                            key: {type: string}
                        azureKeyVault:
                          description: >-
                            A Key Vault secret the exit node's workload
                            identity may read, and that the exit node lists
                            for this namespace.
                          type: object
                          required: [vaultUri, secretName]
                          properties:
                            vaultUri: {type: string, format: uri}
                            secretName: {type: string}
                grantableRoles:
                  description: >-
                    What the coordinator may grant a user here: database roles
                    for postgres, ACL profile names for redis, or groups to
                    impersonate for kubernetes.
                  type: array
                  items: {type: string}
                labels:
                  description: >-
                    Labels that grants and users select the service by. The
                    labels cluster, kind, name and namespace are attached
                    automatically and cannot be set here.
                  type: object
                  maxProperties: 32
                  x-kubernetes-validations:
                    - rule: "self.all(k, size(k) <= 63)"
                      message: label keys must be at most 63 characters
                  additionalProperties: {type: string, maxLength: 256}
            status:
              type: object
              properties:
                observedGeneration: {type: integer}
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type: {type: string}
                      status: {type: string}
                      reason: {type: string}
                      message: {type: string}
                      observedGeneration: {type: integer}
                      lastTransitionTime: {type: string, format: date-time}
